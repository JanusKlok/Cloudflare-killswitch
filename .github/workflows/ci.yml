name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions are pinned to full commit SHAs, not tags: a tag is mutable, so
      # a compromised or retagged release would run here with write access to
      # the workflow's token. Comments record the human-readable version so
      # Dependabot can still propose bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No `version:` input — the action reads `packageManager` from
      # package.json, keeping one source of truth. This must resolve to
      # pnpm >= 10.26: `minimum-release-age` and `trust-policy` need >= 10.16
      # and `block-exotic-subdeps` needs >= 10.26, and older pnpm ignores all
      # three silently, so the .npmrc supply-chain quarantine would be enforced
      # locally and absent in CI.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Verify the supply-chain settings are actually in effect
        run: |
          set -euo pipefail
          echo "pnpm $(pnpm --version)"
          for key in minimum-release-age ignore-scripts save-exact block-exotic-subdeps trust-policy; do
            value="$(pnpm config get "$key")"
            echo "  $key = $value"
            if [ -z "$value" ] || [ "$value" = "undefined" ]; then
              echo "::error::pnpm is ignoring .npmrc setting '$key' — this pnpm version is too old"
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create wrangler.toml from example
        run: cp wrangler.toml.example wrangler.toml

      - name: Generate Cloudflare runtime types
        run: pnpm types

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Typecheck scripts
        run: pnpm exec tsc --noEmit -p tsconfig.scripts.json

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test
